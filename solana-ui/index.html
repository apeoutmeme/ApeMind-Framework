<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solana Swarm Simulator</title>
    <script src="https://bundle.run/buffer@6.0.3"></script>
    <script>
      window.global = window;
      var Buffer = buffer.Buffer;
      window.Buffer = Buffer;
    </script>
    <script type="module" src="/src/polyfills.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f8fafc;
      }
      .card {
        background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
        color: white;
        padding: 20px;
        border-radius: 16px;
        margin-bottom: 20px;
      }
      #messages {
        height: 400px;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.1);
        padding: 10px;
        border-radius: 8px;
      }
      input, button {
        margin: 10px 0;
        padding: 8px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Solana Trading Swarm</h2>
      <input type="text" id="mintAddress" placeholder="Enter token mint address" />
      <button id="startButton">Start Simulation</button>
      <div id="stats"></div>
      <div id="messages"></div>
    </div>
  </body>
</html>
